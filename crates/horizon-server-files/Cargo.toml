[package]
name = "horizon-server-files"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dedicated server's vanilla files: server.properties, eula.txt, ops, whitelist and bans, and account lookups"

[dependencies]
# std::fs, std::time and std::thread, or the browser's on the web build.
horizon-std = { path = "../horizon-std" }
horizon-core = { path = "../horizon-core" }
# server.properties and eula.txt are Java-properties files; the parser is shared with horizon-mod-wasm.
horizon-java-properties = { path = "../horizon-java-properties" }
horizon-protocol = { path = "../horizon-protocol" }
horizon-world = { path = "../horizon-world" }
serde = { version = "1", features = ["derive"] }
log = "0.4"
getrandom = "0.3"
# Online mode: finding accounts by name (the services' profiles endpoint).
# Secure chat: the services' public keys arrive base64-encoded.
base64 = "0.22"

# No sockets in a browser: the web build looks no account up.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# Durable file publication (durable.rs): MoveFileExW with MOVEFILE_WRITE_THROUGH.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
