ids = ["hook:crafting_recipe_choice", "type:CraftingRecipeChoiceEvent", "handle:PlayerRef::crafting_changed", "method:Hooks::crafting_recipe_choice"]
why = "Adds crafting_recipe_choice: when a crafting grid matches more than one recipe, a mod picks which one is made (Polymorph). Both sides, loop context, no Host; told the crafting player (uuid) or the crafter block (position), so a mod can keep one choice per player; asked from Recipes::find_with_dimensions, so the result slot, the take, its remainders, item_crafted and the crafter all follow the choice. prepare_item_craft can't do this: a replace hook is only asked while the result is empty. PlayerRef::crafting_changed (server) makes a player's crafting results again after the mod's answer changed while the grid did not, as Polymorph's selection packet calls slotsChanged. New hook and method: no existing hook version changes."
