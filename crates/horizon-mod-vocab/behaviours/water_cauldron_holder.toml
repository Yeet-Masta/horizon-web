version = 1
doc = """\
A mod-owned block entity type may opt in to hold data on `minecraft:water_cauldron` without changing its block ID or levels. \
The holder survives level changes and chunk saves, not removal or replacement. During a cauldron interaction, the first fill exposes the incoming holder in `fire`, \
and the saved payload, cauldron state and inventory exchange commit or roll back together. Matching Horizon peers receive the holder and its mod update tag; vanilla peers see only the block state."""
