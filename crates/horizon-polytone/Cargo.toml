[package]
name = "horizon-polytone"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Polytone-format resource pack files: targets, and the biome and dimension modifiers' environment attribute layers"

[dependencies]
# std::fs, std::time and std::thread, or the browser's on the web build (web/README.md).
horizon-std = { path = "../horizon-std" }
log = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde_json = "1"

[lints]
workspace = true
