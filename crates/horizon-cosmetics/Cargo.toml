[package]
name = "horizon-cosmetics"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cosmetic items drawn on players by Horizon clients: the item format, attachment to the player model's bones, simple animations, and what other players wear (fetched and cached)"

[dependencies]
base64 = "0.22"
glam = "0.30"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# Files, clocks, threads and HTTP: std's natively, the browser's on the web build.
horizon-platform = { path = "../horizon-platform" }

# The service over HTTPS; the web build has none (`enabled`).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[lints]
workspace = true
