[package]
name = "horizon-native-java"
# The probe; `horizon-java-run` (src/bin) runs programs for tools/java_conformance.py.
default-run = "horizon-native-java"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Native Rust probe for a bounded Fabric/NeoForge Java bytecode subset"

[dependencies]
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
