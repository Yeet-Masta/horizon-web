[package]
name = "horizon-native-java"
# The probe; `horizon-java-run` (src/bin) runs programs for tools/java_conformance.py.
default-run = "horizon-native-java"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Native Rust probe for a bounded Fabric/NeoForge Java bytecode subset"

[dependencies]
# The VM (src/vm): deterministic Math (libm), BigInteger/BigDecimal (num-bigint),
# java.util.regex (regex). All pure Rust and browser-safe.
libm = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
