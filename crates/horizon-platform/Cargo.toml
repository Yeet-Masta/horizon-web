[package]
name = "horizon-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "The OS services the game reads (files, clocks, the environment, threads): std on native targets, the browser on the web build"

[dependencies]
pollster = "0.4"

# The web build (web/README.md): wasm32- or wasm64-unknown-unknown in a browser.
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1"
# The threaded build's heaps (web/alloc.rs): dlmalloc, each behind a lock of its own.
dlmalloc = { version = "0.2.14", default-features = false }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
# The prepared resources arrive as one zip, read in place: its entries are
# inflated outside the file system's lock (web/vfs.rs, `Unzip`).
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
# The browser's crypto.getRandomValues for getrandom 0.3 and 0.4 (wasm64:
# `getrandom_backend = "custom"`, .cargo/config.toml) and 0.2 (its `custom` feature).
getrandom = "0.3"
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
# HTTPS through the relay's TCP tunnel with TLS in the module (web/https.rs), so the relay only
# carries ciphertext: RustCrypto's algorithms, which build for wasm64 (ring's don't).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
webpki-roots = "1"
# Its clock is the page's (`UnixTime::now` needs it in a browser).
rustls-pki-types = { version = "1", features = ["web"] }

[lints]
workspace = true

# wasm32 takes getrandom 0.3's and 0.4's own source (`getrandom_backend = "wasm_js"`,
# .cargo/config.toml): zip 9 turns on 0.4's `wasm_js` there, which doesn't build beside a
# custom one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
