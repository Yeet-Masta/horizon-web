# The web build's checks (web/README.md, "Checks"): every merge of upstream brings native-only
# calls that fail, panic or block in a browser, and they only show at run time.
#   hazards: the wasm32 build linted for std's file system, clocks, environment and threads
#            (tools/web_hazards.py), against the calls known to run only natively (web/hazards.json)
#   build:   the one-thread wasm32 and the threaded wasm64 builds checked, the threaded wasm32 build
#            built (web/build.sh), and
#            the page opened in Chromium (tools/web_smoke.py): the module loads, and with prepared
#            resources (the HORIZON_WEB_RESOURCES_URL secret: a zip web/pack-resources.sh made, from
#            the account's own game, kept private) a new world opens and keeps drawing. The page
#            (web/dist: the game's module, its page and fonts, never Minecraft's resources, which each
#            player brings) is kept as the run's artifact, and a push to `web` that passes replaces
#            the `web-latest` release's zip with it.
name: Web

on:
  push:
    branches: [web]
  pull_request:
    branches: [web]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hazards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the wasm32 target and clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-hazards
      - name: Native-only calls the web build would make
        run: python3 tools/web_hazards.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # The web-latest release (on pushes to `web` only).
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-toolchain
        with:
          cache-key: web-build
      - name: The one-thread wasm32 build compiles
        run: cargo check --config web/simd.toml -p horizon-client --bin horizon-client --no-default-features --target wasm32-unknown-unknown
      - name: The threaded wasm64 build compiles (web/build.sh --wasm64)
        run: cargo +nightly check -Zbuild-std=std,panic_abort -p horizon-client --bin horizon-client --no-default-features --target wasm64-unknown-unknown --profile fast --config web/simd.toml --config web/threads.toml
      - name: Build the threaded wasm32 page
        run: bash web/build.sh --fast
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright's Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: The prepared resources, when the repository has some
        env:
          RESOURCES_URL: ${{ secrets.HORIZON_WEB_RESOURCES_URL }}
        run: |
          if [ -n "$RESOURCES_URL" ]; then
            curl -fsSL "$RESOURCES_URL" -o "$RUNNER_TEMP/resources.zip"
            echo "SMOKE_ARGS=--resources $RUNNER_TEMP/resources.zip" >> "$GITHUB_ENV"
          fi
      - name: Smoke test in Chromium
        run: xvfb-run -a python tools/web_smoke.py $SMOKE_ARGS
      - name: The page as a zip
        run: |
          short=$(git rev-parse --short HEAD)
          echo "ZIP=$RUNNER_TEMP/horizon-web-$short.zip" >> "$GITHUB_ENV"
          (cd web/dist && zip -qr "$RUNNER_TEMP/horizon-web-$short.zip" .)
          ls -l "$RUNNER_TEMP"/horizon-web-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-web-${{ github.sha }}
          path: ${{ env.ZIP }}
          # Already a zip: stored as it is.
          compression-level: 0
          retention-days: 30
      - name: Publish it as the web-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/web'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="The web build of \`web\` at ${GITHUB_SHA::9}, built and smoke-tested by the Web workflow.
          Unzip it and serve the folder with cross-origin isolation (web/serve.py, or web/README.md for a
          static host); the page asks each player for their own Minecraft resources."
          git tag -f web-latest "$GITHUB_SHA"
          git push -f origin refs/tags/web-latest
          if gh release view web-latest > /dev/null 2>&1; then
            gh release edit web-latest --prerelease --title "Horizon web (latest)" --notes "$notes"
            # Only the newest zip stays.
            gh release view web-latest --json assets --jq '.assets[].name' | while read -r old; do
              gh release delete-asset web-latest "$old" --yes
            done
          else
            gh release create web-latest --prerelease --title "Horizon web (latest)" --notes "$notes" --verify-tag
          fi
          gh release upload web-latest "$ZIP#horizon-web.zip" --clobber
