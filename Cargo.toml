[workspace]
exclude = ["launcher", "crates/horizon-telemetry-server", "crates/horizon-mod-registry", "third_party/wgpu", "third_party/wgpu-core", "third_party/wgpu-hal", "third_party/wgpu-types", "third_party/naga", "third_party/libmimalloc-sys", "third_party/xxhash-rust", "third_party/winit", "third_party/wasm-bindgen"]
members = [
    "crates/horizon-core",
    "crates/horizon-platform",
    "crates/horizon-dualsense",
    "crates/horizon-narrator",
    "crates/horizon-threads",
    "crates/horizon-hdr",
    "crates/horizon-world",
    "crates/horizon-client",
    "crates/horizon-client-lib",
    "crates/horizon-client-core",
    "crates/horizon-client-input",
    "crates/horizon-client-render",
    "crates/horizon-cosmetics",
    "crates/horizon-command",
    "crates/horizon-items",
    "crates/horizon-server-files",
    "crates/horizon-anticheat",
    "crates/horizon-chat-filter",
    # The Model Context Protocol, shared by horizon-ctl, horizon-server and the launcher.
    "crates/horizon-mcp",
    "crates/horizon-server",
    "crates/horizon-bots",
    "crates/horizon-assets",
    "crates/horizon-protocol",
    "crates/horizon-theme",
    "crates/horizon-prepare",
    "crates/horizon-telemetry",
    "crates/horizon-bench",
    "crates/horizon-friends",
    "crates/horizon-relay",
    "crates/horizon-web-relay",
    "crates/horizon-mods",
    "crates/horizon-mod-api-gen",
    "crates/horizon-mod-api-gen/dispatch-tests",
    "crates/cargo-horizon-mod",
    "crates/horizon-port-pack",
    "crates/horizon-shaders",
    "crates/horizon-optifine",
    "crates/horizon-shader-api",
    "crates/horizon-release-sign",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

# wgpu-hal 30.0.1 with gfx-rs/wgpu#10124: wgpu 30 creates a Vulkan descriptor
# pool with no pool sizes while it creates the device, which Vulkan allows only
# since 1.3.215, and Intel's Windows driver for 6th-10th gen iGPUs (HD 520/530,
# UHD 620/630) crashes on it with an access violation (#746). It also fixes the
# Metal backend's lookup of the CoreGraphics HDR colour space names, which handed
# CoreGraphics a symbol's address as the string and crashed HDR output on macOS.
# And gfx-rs/wgpu#10714: on Windows, Vulkan waits for the acquire fence only in
# FIFO (VSync), where it was meant to pace frames; with VSync off it made every
# frame wait for the GPU to finish the one before (#4604).
# Drop this and the folder once a wgpu release has these fixes.
#
# wgpu, wgpu-core and wgpu-types 30.0.1 (and wgpu-hal) with `target_arch = "wasm32"`
# read as `target_family = "wasm"`: wgpu 30 counts wasm64 as a native target, so
# the web build on wasm64-unknown-unknown (web/README.md) had no WebGPU backend.
#
# The wasm-bindgen family at a commit of its main branch: threads on memory64 (#5378), which
# the web build's workers need (web/README.md), aren't in a release yet. The CLI
# must be built from that commit (web/build.sh says how). Back to
# crates.io once a release has them.
[patch.crates-io]
# wasm-bindgen itself from third_party/ (its closures' unwind-safety bound on wasm64; the folder's
# Cargo.toml), here and for js-sys, web-sys and wasm-bindgen-futures, which name it from git.
wasm-bindgen = { path = "third_party/wasm-bindgen" }
wasm-bindgen-futures = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "39ae823bbc14c9d0a4a2869361483b5453a9b133" }
js-sys = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "39ae823bbc14c9d0a4a2869361483b5453a9b133" }
web-sys = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "39ae823bbc14c9d0a4a2869361483b5453a9b133" }
wgpu = { path = "third_party/wgpu" }
wgpu-core = { path = "third_party/wgpu-core" }
wgpu-hal = { path = "third_party/wgpu-hal" }
wgpu-types = { path = "third_party/wgpu-types" }
# naga 30.0.1, with the fixes to its GLSL frontend that shader packs need (THIRD_PARTY_NOTICES.md).
naga = { path = "third_party/naga" }
# libmimalloc-sys 0.1.49 whose mimalloc v3 counts bits without POPCNT when MSVC builds it: the
# game died before main on CPUs without it (Core 2, #7264; THIRD_PARTY_NOTICES.md). Drop this and
# the folder once a libmimalloc-sys release has microsoft/mimalloc#1291's fix.
libmimalloc-sys = { path = "third_party/libmimalloc-sys" }
# xxhash-rust 0.8.19 whose WebAssembly SIMD paths name `target_arch = "wasm32"` instead of
# `target_family = "wasm"`: they use `core::arch::wasm32`, so the web build on wasm64 (web/README.md)
# didn't compile. Drop this and the folder once a release has the fix.
xxhash-rust = { path = "third_party/xxhash-rust" }
# winit 0.30.13 whose web callbacks (wasm-bindgen closures) assert unwind safety, as
# wasm-bindgen asks of a build whose panics unwind (web/unwind.toml): unwinding through them
# drops what they hold, where an abort left it held. Drop this and the folder with winit 0.31.
winit = { path = "third_party/winit" }

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[patch."https://github.com/wasm-bindgen/wasm-bindgen"]
wasm-bindgen = { path = "third_party/wasm-bindgen" }
